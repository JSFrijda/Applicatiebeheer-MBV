Metadata:
  lang: nl 
  title: SR CTA coronairen
  description:
    Template CTA coronairen
  versionMajor: 3
  versionMinor: 1
  reportVersion: v1
ReportOutput:
  - text: "{reportSummary}"
Components:
#Algemene gedeelte 
- Header:
    header: Algemeen
    level: h4

- HR: {}

- Row:
    label: Uitvoering 
    components:
    - Option: 
        id: Uitvoering
        size: m
        mandatory: prohibit
        options: [ECG getriggerde CTA coronairen, ECG getriggerde CTA met calciumscore berekening]

- Row: 
    label: Hartfrequentie
    components: 
    - Number: 
        id: Hartfrequentie
        enforceValueRange: loose
        minValue: 30
        maxValue: 220

- Row:
    label: Ritme
    components:
    - Text:
        id: Ritme
        placeholder: 'Bijvoorbeeld sinusritme of atriumfibrileren'
        
- Row:
    label: Kwaliteit onderzoek
    components:
      - Option:
          id: kwaliteit
          options:
            - Goed
            - Matig
            - Slecht

- Row:
    label: Vrij tekst over kwaliteit
    components:
      - Text:
          id: kwaliteit_vrij

# Anatomie gedeelte
- Header:
    header: Anatomie
    level: h4
- HR: {}
    
- Row:
    label: Cardiale anatomie normaal?
    components:
      - Option:
          id: anatomie_normaal
          mandatory: prohibit
          options:
            - Ja
            - Nee

- Row:
    display: Eq(anatomie_normaal,'Nee')
    label: toelichting abnormale anatomie
    components:
      - Text:
          id: anatomie_vrij
          mandatory: prohibit

- Row:
    label: Dominantie
    components:
      - Option:
          id: dominantie
          mandatory: prohibit
          options:
            - Links dominant
            - Rechts dominant
            - Co-dominant



- Summary:
    id: Summary_Algemeen
    hidden: true
    reportTemplate:
      - text: |
          {IfNotEmpty(Uitvoering,Concat("<b>Uitvoering: </b>",Uitvoering,IfNotEmpty(Hartfrequentie,Concat(". Hartfrequentie: ",Hartfrequentie," slagen per minuut."),""),IfNotEmpty(Ritme,Concat(" ",Ritme,"."),"")),"")}
          
          {If(Uitvoering,"<b>Bevindingen: </b>", "")}
          {If(Or(IsNotEmpty(kwaliteit),IsNotEmpty(kwaliteit_vrij),IsNotEmpty(anatomie_normaal),IsNotEmpty(anatomie_vrij),IsNotEmpty(dominantie)),Concat(If(IsNotEmpty(kwaliteit),Concat("Onderzoek van ",If(Eq(kwaliteit,"Goed"),"goede",If(Eq(kwaliteit,"Matig"),"matige",If(Eq(kwaliteit,"Slecht"),"slechte","")))," kwaliteit. "),""),If(IsNotEmpty(kwaliteit_vrij),Concat(kwaliteit_vrij,". "),""),If(Eq(anatomie_normaal,"Nee"),Concat(anatomie_vrij,""),If(Eq(anatomie_normaal,"Ja"),"Normale cardiale anatomie","")),If(IsNotEmpty(dominantie),If(Eq(dominantie,"Links dominant"),". Links dominant systeem. ",If(Eq(dominantie,"Rechts dominant"),". Rechts dominant systeem. ",If(Eq(dominantie,"Co-dominant"),". Co-dominant systeem. ",""))),"")),"")}
          
# algemeen en anatomie gedeelte klaar met ook eerste verslag component.             

# =========================================
# LINKS DOMINANT SYSTEEM
# =========================================
- ComponentGroup:
    id: Header_Links_Dominant
    display: Eq(dominantie,'Links dominant')
    borderBottom: true
    components:
    - Header:
        level: h4
        header: Linker dominant systeem

# Hoofdstam Links
- Button:
    id: Hoofdstam_Links
    display: Eq(dominantie,'Links dominant')
    label: Hoofdstam
    posAlignment: left
    color: blue
    style: Default
    padding: component
    toggleComponentId: Hoofdstam_Links_Block

- Row:
    id: Hoofdstam_Links_Block
    hidden: Or(Eq(dominantie,'Rechts dominant'),Eq(dominantie,'Co-dominant'))
    display: false
    components:
    - Option:
        id: Normaal_Hoofdstam_Links
        prefix: 'Normaal:                         '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        mandatory: =If(Eq(dominantie,'Links dominant'),'prohibit','none')
        options: [Ja, Nee]

    - Option:
        id: Segment_Hoofdstam_Links
        display: Eq(Normaal_Hoofdstam_Links,'Nee')
        prefix: 'Segment:                         '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        multichoice: true
        options: [Proximaal, Midsegment, Distaal]

    - Header:
        header: Proximaal
        level: h4
        display: And(Eq(Normaal_Hoofdstam_Links,'Nee'),InArray(Segment_Hoofdstam_Links,'Proximaal'))

    - Option:
        id: Soortplaque_Hoofdstam_Links_Proximaal
        display: And(Eq(Normaal_Hoofdstam_Links,'Nee'),InArray(Segment_Hoofdstam_Links,'Proximaal'))
        prefix: 'Soort Plaque:                   '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        mandatory: =If(And(Eq(dominantie,'Links dominant'),Or(Eq(Stenose_Hoofdstam_Links_Proximaal,'<25%'),Eq(Stenose_Hoofdstam_Links_Proximaal,'25-49%'),Eq(Stenose_Hoofdstam_Links_Proximaal,'50-69%'),Eq(Stenose_Hoofdstam_Links_Proximaal,'70-99%'),Eq(Stenose_Hoofdstam_Links_Proximaal,'Occlusie'))),'prohibit','none')
        options: [Calcified, Mixed plaque, Soft plaque]

    - Option:
        id: Stenose_Hoofdstam_Links_Proximaal
        display: And(Eq(Normaal_Hoofdstam_Links,'Nee'),InArray(Segment_Hoofdstam_Links,'Proximaal'))
        prefix: 'Stenose:                           '
        prefixStyle: normal
        size: xl
        mandatory: =If(Eq(dominantie,'Links dominant'),'prohibit','none')
        options: ["<25%","25-49%","50-69%","70-99%","Occlusie"]

    - Header:
