    display: Eq(dominantie,'Links dominant')
    label: LCX +
    posAlignment: left
    color: blue
    style: Default
    padding: component
    toggleComponentId: LCX_Extra_Vat1_Links_Block

- Row:
    id: LCX_Extra_Vat1_Links_Block
    hidden: Or(Eq(dominantie,'Rechts dominant'),Eq(dominantie,'Co-dominant'))
    display: false
    components:
    - Option:
        id: Normaal_LCX_Extra_Vat1_Links
        prefix: 'Normaal:                         '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        mandatory: =If(Eq(dominantie,'Links dominant'),'prohibit','none')
        options: [Ja, Nee]

    - Text:
        id: Naam_LCX_Extra_Vat1_Links
        prefix: 'Naam extra vat:              '
        prefixStyle: normal
        size: xl
        mandatory: =If(Eq(dominantie,'Links dominant'),'prohibit','none')
        placeholder: "Bijv: intermedius, zijtak D1"

    - Option:
        id: Segment_LCX_Extra_Vat1_Links
        display: Eq(Normaal_LCX_Extra_Vat1_Links,'Nee')
        prefix: 'Segment:                         '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        multichoice: true
        options: [Proximaal, Midsegment, Distaal]

    - Header:
        header: Proximaal
        level: h4
        display: And(Eq(Normaal_LCX_Extra_Vat1_Links,'Nee'),InArray(Segment_LCX_Extra_Vat1_Links,'Proximaal'))

    - Option:
        id: Soortplaque_LCX_Extra_Vat1_Links_Proximaal
        display: And(Eq(Normaal_LCX_Extra_Vat1_Links,'Nee'),InArray(Segment_LCX_Extra_Vat1_Links,'Proximaal'))
        prefix: 'Soort Plaque:                   '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        mandatory: =If(And(Eq(dominantie,'Links dominant'),Or(Eq(Stenose_LCX_Extra_Vat1_Links_Proximaal,'<25%'),Eq(Stenose_LCX_Extra_Vat1_Links_Proximaal,'25-49%'),Eq(Stenose_LCX_Extra_Vat1_Links_Proximaal,'50-69%'),Eq(Stenose_LCX_Extra_Vat1_Links_Proximaal,'70-99%'),Eq(Stenose_LCX_Extra_Vat1_Links_Proximaal,'Occlusie'))),'prohibit','none')
        options: [Calcified, Mixed plaque, Soft plaque]

    - Option:
