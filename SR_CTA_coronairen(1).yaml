# Nevenbevindingen, Conclusie en Cardioloog.
- Header: 
    level: h4
    header: Invullen door Nucleair geneeskundige
    
- HR: {}    
    
    
- Row:
    label: 'Nevenbevindingen'
    components:
    - Text:
        id: Nevenbevindingen
    
- Row:
    label: Vrije tekst Conclusie
    components:
    - Text:
        id: Conclusie_Vrij
    
- Row:
    label: Mede beoordeeld door cardioloog
    components:
    - Option: 
        id: Beoordeeld_Cardioloog
        options: [Ja, Nee]
       
- Row:
    label: 'Cardioloog: '
    display: Eq(Beoordeeld_Cardioloog, 'Ja')
    components:
    - Dropdown: 
        id: Dropdown_Cardioloog
        placeholder: Kies cardioloog
        mandatory: prohibit
        options: [Mouden, Veldhorst, Yokota, Timmer, Riezebos, Anders]
    
- Row:
    label: 'Naam cardioloog: '
    display: And(Eq(Beoordeeld_Cardioloog,'Ja'),Eq(Dropdown_Cardioloog,'Anders'))
    components:
    - Text:
        id: Naam_Cardioloog
        mandatory: prohibit
    
- Text:
      id: Cardioloog_Output
      hidden: true
      value: '=If(And(Eq(Beoordeeld_Cardioloog,"Ja"),IsNotEmpty(Dropdown_Cardioloog),Or(NotEq(Dropdown_Cardioloog,"Anders"),IsNotEmpty(Naam_Cardioloog))),Concat("Medebeoordeeld door collega ",If(Eq(Dropdown_Cardioloog,"Anders"),Naam_Cardioloog,Dropdown_Cardioloog),", cardioloog."),"")'

# =========================================
# CALCIUMSCORE
# =========================================
- ComponentGroup:
    id: Calciumscore
    display: Eq(Uitvoering, "ECG getriggerde CTA met calciumscore berekening")
    borderBottom: true
    components:
    - Header:
        header: Calciumscore
        level: h4

- Row:
    label: 'Calciumscore:'
    display: Eq(Uitvoering, "ECG getriggerde CTA met calciumscore berekening")
    components:
    - Number:
        id: CACS_Score
        minValue: 0
- Row:
    label: 'Percentiel:'
    display: Eq(Uitvoering, "ECG getriggerde CTA met calciumscore berekening")
    components:
    - Number:
        id: CACS_Percentiel
        minValue: 0
        maxValue: 100
            
- Row:
    label: 'Hoofdstam:'
    display: Eq(Uitvoering, "ECG getriggerde CTA met calciumscore berekening")
    components:
    - Number:
        id: CACS_Hoofdstam
        minValue: 0
        value: 0

- Row:
    label: 'LAD:'
    display: Eq(Uitvoering, "ECG getriggerde CTA met calciumscore berekening")
    components:
    - Number:
        id: CACS_LAD
        minValue: 0
        value: 0

- Row:
    label: 'LCX:'
    display: Eq(Uitvoering, "ECG getriggerde CTA met calciumscore berekening")
    components:
    - Number:
        id: CACS_LCX
        minValue: 0
        value: 0
        
- Row:
    label: 'RCA:'
    display: Eq(Uitvoering, "ECG getriggerde CTA met calciumscore berekening")
    components:
    - Number:
        id: CACS_RCA
        minValue: 0
        value: 0

# Verborgen vlag die door JavaScript op "Ja" wordt gezet
# als totale calciumscore en vatsom niet overeenkomen.
- Text:
    id: CACS_Mismatch
    hidden: true

# Zichtbare waarschuwing bij een mismatch.
- Header:
    display: And(Eq(Uitvoering,"ECG getriggerde CTA met calciumscore berekening"),Eq(CACS_Mismatch,'Ja'))
    header: 'WAARSCHUWING: calciumscore en vatscores komen niet overeen'
    level: h4

- Row:
    label: Controle calciumscore
    display: And(Eq(Uitvoering,"ECG getriggerde CTA met calciumscore berekening"),Eq(CACS_Mismatch,'Ja'))
    components:
    - Text:
        id: CACS_Controle

# Wordt alleen "Ja" als:
# CACS_Score = hoofdstam + LAD + LCX + RCA
- Text:
    id: CACS_Validatie_OK
    hidden: true

- Text:
    id: CACS_Output
    hidden: true

- Text:
    id: CACS_Conclusie
    hidden: true

- Text:
    id: CAC_DRS_Output
    hidden: true
    
#CADRADS gedeelte 
- Text:
    id: CADRADS_output
    hidden: true
    
- Text: 
    id: CADRADS_verslag
    hidden: true
    

- Summary:
    id: Summary_NG
    hidden: true
    reportTemplate: 
    - text: |
          
          {IfNotEmpty(Nevenbevindingen, Concat("Nevenbevindingen: ",  Nevenbevindingen,"."))}
          
          {If(Or(IsNotEmpty(Conclusie_Vrij),IsNotEmpty(CADRADS_verslag),IsNotEmpty(CACS_Conclusie),IsNotEmpty(If(Eq(CADRADS_output,"CAD-RADS: 0"),"",CADRADS_output)),IsNotEmpty(CAC_DRS_Output)),Concat("<b>Conclusie:</b><br>",IfNotEmpty(CADRADS_verslag,Concat(CADRADS_verslag,If(IsNotEmpty(Conclusie_Vrij),"<br>",If(IsNotEmpty(CACS_Conclusie),"<br>",If(Or(IsNotEmpty(If(Eq(CADRADS_output,"CAD-RADS: 0"),"",CADRADS_output)),IsNotEmpty(CAC_DRS_Output)),"<br><br>",""))))),IfNotEmpty(Conclusie_Vrij,Concat(Conclusie_Vrij,".",If(IsNotEmpty(CACS_Conclusie),"<br>",If(Or(IsNotEmpty(If(Eq(CADRADS_output,"CAD-RADS: 0"),"",CADRADS_output)),IsNotEmpty(CAC_DRS_Output)),"<br><br>","")))),IfNotEmpty(CACS_Conclusie,Concat(CACS_Conclusie,If(Or(IsNotEmpty(If(Eq(CADRADS_output,"CAD-RADS: 0"),"",CADRADS_output)),IsNotEmpty(CAC_DRS_Output)),"<br><br>",""))),If(Eq(CADRADS_output,"CAD-RADS: 0"),"",IfNotEmpty(CADRADS_output,Concat(CADRADS_output,".",If(IsNotEmpty(CAC_DRS_Output),"<br>","")))),IfNotEmpty(CAC_DRS_Output,Concat(CAC_DRS_Output,"."))),"")}
          
          {Cardioloog_Output}

- Summary:
    id: reportSummary
    display: true
    editable: true
    label: "Verslag:"
    reportTemplate:
    - text: | 
          {Summary_Algemeen}
          {Summary_Links_Dominant}
          {Summary_Rechts_Dominant}
          {CACS_Output}
          
          {Summary_NG}
          
          
          
  
