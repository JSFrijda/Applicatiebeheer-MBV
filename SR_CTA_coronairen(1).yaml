# Hoofdstam Rechts
- Button:
    id: Hoofdstam_Rechts
    display: Or(Eq(dominantie,'Rechts dominant'),Eq(dominantie,'Co-dominant'))
    label: Hoofdstam
    posAlignment: left
    color: blue
    style: Default
    padding: component
    toggleComponentId: Hoofdstam_Rechts_Block

- Row:
    id: Hoofdstam_Rechts_Block
    hidden: Eq(dominantie,'Links dominant')
    display: false
    components:
    - Option:
        id: Normaal_Hoofdstam_Rechts
        prefix: 'Normaal:                         '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        mandatory: =If(Or(Eq(dominantie,'Rechts dominant'),Eq(dominantie,'Co-dominant')),'prohibit','none')
        options: [Ja, Nee]

    - Option:
        id: Segment_Hoofdstam_Rechts
        display: Eq(Normaal_Hoofdstam_Rechts,'Nee')
        prefix: 'Segment:                         '
        prefixStyle: normal
        size: xl
        optionLayout: fill-auto
        multichoice: true
        options: [Proximaal, Midsegment, Distaal]

    - Header:
        header: Proximaal
        level: h4
        display: And(Eq(Normaal_Hoofdstam_Rechts,'Nee'),InArray(Segment_Hoofdstam_Rechts,'Proximaal'))

